name: Deploy React App to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: |
          npm run build
          if [ -d "build" ]; then echo "OUTPUT_DIR=build" >> $GITHUB_ENV; fi
          if [ -d "dist" ]; then echo "OUTPUT_DIR=dist" >> $GITHUB_ENV; fi

      - name: Create Artifact
        run: tar -C ${{ env.OUTPUT_DIR }} -czf artifact.tar.gz .

      - name: Copy Artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          source: "artifact.tar.gz"
          target: "/home/${{ secrets.EC2_SSH_USER }}/artifact.tar.gz"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            sudo /usr/local/bin/deploy_artifact.sh /home/${{ secrets.EC2_SSH_USER }}/artifact.tar.gz
